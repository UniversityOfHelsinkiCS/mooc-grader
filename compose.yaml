# Local development: the app in watch mode and a Postgres for the action log
#
#   docker compose up            app at http://localhost:3033/
#   docker compose down -v       also drops the database
#
# The app reads GITHUB_TOKEN etc. from .env and the mooc.fi session cookie
# from the cookie file, as when run without containers. The database is
# reachable from the host at postgres://mooc:mooc@localhost:5433/mooc_grader
services:
  app:
    image: node:24-alpine
    working_dir: /app
    # node_modules lives in a volume so that it is installed for Linux
    command: sh -c "npm ci && npm run dev"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://mooc:mooc@db:5432/mooc_grader
    ports:
      - "3033:3033"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mooc
      POSTGRES_PASSWORD: mooc
      POSTGRES_DB: mooc_grader
    volumes:
      - db_data:/var/lib/postgresql/data
      # Run only when the database is created, i.e. on an empty db_data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mooc", "-d", "mooc_grader"]
      interval: 2s
      retries: 15

volumes:
  node_modules:
  db_data:
